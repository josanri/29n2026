name: Redirect GitHub Pages to electosfera.es

# The site lives on Cloudflare (https://electosfera.es/2026/generales/). GitHub Pages no longer publishes a copy of
# the site: a second copy competes with the official one in the search engines. It publishes only a redirect page
# (github-pages/redirect.html) as index.html and 404.html, so the old links to josanri.github.io/29n2026/...
# go to the same page of the official site.

on:
  push:
    branches: [main, master]
    paths:
      - github-pages/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Make the redirect site
        run: |
          mkdir -p _site
          cp github-pages/redirect.html _site/index.html
          cp github-pages/redirect.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
